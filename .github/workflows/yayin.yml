name: Yayinla

# main'e her gönderimde: lint + test + derleme, sonra GitHub Pages'e yayın
# (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Boşsa AI, Supabase Edge Function'ı (src/veri/config.js'teki proje adresi + /functions/v1/ai-proxy) kullanır.
          # Başka bir proxy kullanacaksanız depo Variables altına VITE_AI_PROXY_URL ekleyin.
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: dagit
        uses: actions/deploy-pages@v4
