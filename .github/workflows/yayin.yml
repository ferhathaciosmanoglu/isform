name: Yayinla

# main'e her gönderimde: lint + test + derleme, sonra Cloudflare Pages'e yayın.
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (Pages ve Workers düzenleme yetkili jeton)
# Depo değişkenleri (Variables): VITE_AI_PROXY_URL (AI Worker adresi; boşsa AI kapalıdır), CF_PAGES_PROJE (varsayılan: enorpa-isform)
# Sırlar tanımlı değilse yayın adımları atlanır (derleme ve testler yine çalışır).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
      - name: Cloudflare Pages'e yayınla
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJE || 'enorpa-isform' }}" --branch main
